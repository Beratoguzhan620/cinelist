name: Deploy web demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Web build for /${{ github.event.repository.name }}/
        run: pnpm build:web
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
          # Demo mode: the films live in the browser, so the demo needs no json-server.
          EXPO_PUBLIC_DEMO: "1"
          EXPO_PUBLIC_API_URL: /${{ github.event.repository.name }}
      # The seed posters, and 404.html so deep links still open the app on GitHub Pages.
      - run: |
          cp -r server/public/posters dist/posters
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
